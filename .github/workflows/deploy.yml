name: Deploy Flipkart

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        working-directory: flipkart-backend
        run: ./mvnw clean test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flipkart-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: flipkart-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: flipkart-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: flipkart-frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/ansible-flipkart
            ansible-playbook -i inventory deploy-github.yml
